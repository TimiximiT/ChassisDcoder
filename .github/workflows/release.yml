name: Release Windows

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=/ucrt64/bin/g++.exe \
            -DCMAKE_MAKE_PROGRAM=/ucrt64/bin/mingw32-make.exe

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --parallel

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/chassisdcoder.exe
            build/chassisdcoder_console.exe
          name: ChassisDcoder ${{ github.ref_name }}
          body: |
            Windows GUI and console builds.

            GUI: chassisdcoder.exe

            Console usage:
            - chassisdcoder_console.exe <VIN> [--full]
            - If the VIN is omitted, the program prompts for one.

            Both require network access to vpic.nhtsa.dot.gov.
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}